<!doctype html>
<!-- Tells the browser this is a modern HTML5 page -->
<html lang="en">
<!-- Page language is English (helps screen readers and translation tools) -->
<head>
<!-- Everything inside <head> is information about the page, not visible content -->
<meta charset="utf-8">
<!-- Use UTF-8 so symbols like R, £ and curly quotes display correctly -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Make the page fit the device width so it works on phones -->
<title>Your order | Sunrise Bakery</title>
<!-- The text shown in the browser tab and search results -->
<meta name="description" content="Review your cart, choose collection or delivery and continue to secure payment.">
<!-- A short summary search engines may show under the title (NFR-SEO-001) -->
<meta name="theme-color" content="#FFF8EE">
<!-- Colour of the browser toolbar on mobile (matches the cream page background) -->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<!-- The small icon shown in the browser tab -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Start connecting to Google Fonts early so fonts load faster -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Also connect to the server that hosts the font files -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap">
<!-- Load the two fonts used on the site: DM Sans (body) and Playfair Display (headings) -->
<link rel="stylesheet" href="css/styles.css">
<!-- Load the site's own stylesheet with all colours, layout and components -->
</head>
<!-- End of the page information -->
<body data-page="cart">
<!-- Start of the visible page. data-page tells the scripts which menu link to highlight (data-category is used on product list pages) -->
<noscript><div class="wrap section"><p class="notice">This page needs JavaScript to show products and your cart. Please enable it, or contact the bakery to place an order.</p></div></noscript>
<!-- Shown only if the visitor's browser has JavaScript turned off -->
<main id="main">
<!-- Main page content -->
<div class="page-head"><div class="wrap">
<!-- Page title area -->
  <h1>Your order</h1>
  <!-- Page heading -->
  <ol class="progress" aria-label="Checkout progress"><li class="is-done">1 Cart</li><li class="is-done">2 Details</li><li>3 Secure payment</li><li>4 Confirmation</li></ol>
  <!-- Progress steps: Cart and Details are highlighted; payment and confirmation happen on the provider's side -->
</div></div>
<section class="section" style="padding-top:24px"><div class="wrap" id="cart-root"></div></section>
<!-- Empty container; cart.js draws the cart, checkout form and order summary here -->
</main>
<!-- End of main content -->
<!-- Scripts load in order: settings, product list, shared code, then this page's own code -->
<script src="js/config.js"></script>
<!-- Bakery settings (contact details, lead time, payment link) -->
<script src="js/products.js"></script>
<!-- The product list used by every page -->
<script src="js/site.js"></script>
<!-- Shared code: header, footer, cart and helper functions -->
<script src="js/cart.js"></script>
<!-- Code specific to this page (cart.js) -->
</body>
<!-- End of the visible page -->
</html>
<!-- End of the document -->
